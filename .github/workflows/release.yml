name: release

# Publishing a GitHub release with a version tag (v1.2.3) ships that version:
#   - npm: publishes the CLI, `@lamsa/cli`. npm trusted publishing authenticates the job, so no npm
#     token is stored: the package's settings on npmjs.com name this repository and this workflow file.
#     A tag with a suffix (v1.2.3-rc.1) publishes under the `next` dist-tag, so `npm i @lamsa/cli` skips it.
#   - desktop: builds the editor's installers (Linux .AppImage and .deb; macOS .dmg for Apple silicon
#     and Intel), launches each build once to check it works, and attaches them to the release with
#     the files the app's updater reads (latest-*.yml, the macOS .zip, .blockmap).
#     macOS builds are signed with the CSC_* secrets and also notarized with the APPLE_API_* ones; with
#     neither, they're signed ad hoc. The values are kept in 1Password ("lamsa macOS signing").
#       CSC_LINK          the Developer ID Application certificate as a base64 .p12
#       CSC_KEY_PASSWORD  its password
#       APPLE_API_KEY     the App Store Connect API key (.p8 file contents)
#       APPLE_API_KEY_ID  its key ID
#       APPLE_API_ISSUER  its issuer ID
#
# Create the release with: gh release create v1.2.3 --title "v1.2.3" --notes "..."
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  npm:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Read the version from the tag
        id: version
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag $TAG is not v<major>.<minor>.<patch>[-prerelease]"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then echo "dist_tag=next" >> "$GITHUB_OUTPUT"; else echo "dist_tag=latest" >> "$GITHUB_OUTPUT"; fi

      - name: Stamp the version
        working-directory: packages/cli
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - run: pnpm build

      - run: pnpm lint

      - run: pnpm test:unit

      # The @lamsa/* devDependencies are bundled into dist; their workspace: ranges mean nothing on npm.
      - name: Drop workspace-only fields
        working-directory: packages/cli
        run: npm pkg delete devDependencies

      - name: Check the packed CLI runs
        working-directory: packages/cli
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/try" && cd "$RUNNER_TEMP/try"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/lamsa-cli-*.tgz
          test "$(npx lamsa --version)" = "${{ steps.version.outputs.version }}"

      # Skipping a version already on npm makes a re-run, or a release for a hand-published version, safe.
      - name: Publish to npm
        working-directory: packages/cli
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "@lamsa/cli@$VERSION" version > /dev/null 2>&1; then
            echo "::notice::@lamsa/cli@$VERSION is already on npm; nothing to publish"
            exit 0
          fi
          npm publish --access public --tag "${{ steps.version.outputs.dist_tag }}"

  desktop:
    if: startsWith(github.event.release.tag_name, 'v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: --linux
            executable: apps/desktop/release/linux-unpacked/lamsa-desktop
          # Apple silicon runner; it builds the Intel .dmg too (lamsa has no native modules).
          - os: macos-latest
            platform: --mac
            executable: apps/desktop/release/mac-arm64/lamsa.app/Contents/MacOS/lamsa
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Stamp the version
        working-directory: apps/desktop
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - run: pnpm -r --filter "./packages/*" build

      # Signing needs the certificate (CSC_*); notarization also needs the App Store Connect API key.
      - name: Set up macOS signing
        if: matrix.platform == '--mac'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing certificate: the macOS build is signed ad hoc, and Gatekeeper blocks it when downloaded in a browser."
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_API_KEY" ]; then
            # electron-builder reads APPLE_API_KEY as a path to the .p8 file.
            key="$RUNNER_TEMP/apple-api-key.p8"
            printf '%s' "$APPLE_API_KEY" > "$key"
            echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"
            echo "NOTARIZED=true" >> "$GITHUB_ENV"
          else
            [ -n "$CSC_LINK" ] && echo "::warning::No App Store Connect API key: the macOS build is signed but not notarized, so Gatekeeper still warns when it's downloaded in a browser."
            echo "NOTARIZED=false" >> "$GITHUB_ENV"
          fi

      - name: Build installers
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # An unset secret arrives as an empty string, which electron-builder reads as a file path.
          [ -n "$CSC_LINK" ] || unset CSC_LINK CSC_KEY_PASSWORD
          [ -n "$APPLE_API_KEY_ID" ] || unset APPLE_API_KEY_ID APPLE_API_ISSUER
          extra=""
          if [ "${{ matrix.platform }}" = "--mac" ]; then
            if [ "$SIGNED" != true ]; then
              # Apple silicon won't run an app with a broken signature, so sign it ad hoc.
              extra="-c.mac.identity=- -c.mac.notarize=false"
            elif [ "$NOTARIZED" = true ]; then
              export APPLE_API_KEY="$APPLE_API_KEY_PATH"
            else
              extra="-c.mac.notarize=false"
            fi
          fi
          pnpm exec electron-vite build
          pnpm exec electron-builder ${{ matrix.platform }} --publish never $extra

      - name: Check the signature
        if: matrix.platform == '--mac' && env.SIGNED == 'true'
        run: |
          app=apps/desktop/release/mac-arm64/lamsa.app
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app" 2>&1 | grep -E "^Authority=Developer ID Application"
          if [ "$NOTARIZED" = true ]; then
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
          fi

      # Linux runners have no display, so the Linux build runs under a virtual one.
      - name: Launch the build once
        run: |
          if [ "${{ matrix.platform }}" = "--linux" ]; then
            sudo apt-get install -y --no-install-recommends xvfb > /dev/null
            xvfb-run --auto-servernum node apps/desktop/scripts/smoke-packaged.mjs "${{ matrix.executable }}" "$RUNNER_TEMP/smoke.png"
          else
            node apps/desktop/scripts/smoke-packaged.mjs "${{ matrix.executable }}" "$RUNNER_TEMP/smoke.png"
          fi

      - name: Keep the smoke-test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ runner.os }}
          path: ${{ runner.temp }}/smoke.png
          if-no-files-found: ignore

      - name: Attach installers to the release
        working-directory: apps/desktop/release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          # latest-*.yml and the .zip/.blockmap files are what the app's updater reads.
          files=( *.AppImage *.deb *.dmg *.zip *.blockmap latest*.yml )
          echo "Uploading: ${files[*]}"
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
