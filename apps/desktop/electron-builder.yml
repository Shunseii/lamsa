# Installers for the lamsa editor. `pnpm --filter @lamsa/desktop dist` builds them into release/.
#
# electron-vite bundles everything into out/ except the packages in `dependencies`, which are found on
# disk at run time: playwright-core (PNG export), lucide-static (icon SVGs) and tailwindcss (Tailwind's
# default theme for token reading). Only those ship in the app's node_modules.
appId: dev.lamsa.app
productName: lamsa
copyright: Copyright © lamsa contributors
directories:
  output: release
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
# Exporting PNGs can download Chromium once; playwright-core's installer runs as a plain Node script,
# which needs real files on disk, not the asar archive.
asarUnpack:
  - node_modules/playwright-core/**
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
# The app updates from GitHub releases. electron-builder writes latest-mac.yml / latest-linux.yml next to
# the installers, and the release workflow uploads them; it never publishes on its own (--publish never).
publish:
  provider: github
  owner: Shunseii
  repo: lamsa

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    # The updater downloads the .zip; people download the .dmg.
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.graphics-design
  icon: resources/icon-mac.png
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarizes when the APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER secrets are set; signing
  # uses CSC_LINK and CSC_KEY_PASSWORD. Without them the build is unsigned.
  notarize: true
dmg:
  title: ${productName} ${version}

win:
  # Unsigned for now: SmartScreen warns on first run ("More info" → "Run anyway"). Azure Artifact
  # Signing can be added later with secrets, like macOS signing.
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icons/256.png
nsis:
  # Per-user install into %LOCALAPPDATA%\Programs\lamsa (no admin prompt), which `lamsa open` looks
  # for, and which the updater can replace without elevation.
  oneClick: true
  perMachine: false
  shortcutName: lamsa

linux:
  # lamsa-desktop, not lamsa: the CLI owns the `lamsa` command. The .deb links /usr/bin/lamsa-desktop,
  # which `lamsa open` looks for on PATH. (Set here only: on macOS it would also rename lamsa.app.)
  executableName: lamsa-desktop
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Graphics
  icon: resources/icons/512.png
  maintainer: lamsa <lamsa@users.noreply.github.com>
  synopsis: Design editor for app UI, driven by your coding agent
  description: lamsa is a local-first design tool. Designs are JSON files in your repo; your coding agent does the work, you add the touch.
  desktop:
    entry:
      Name: lamsa
      GenericName: Design editor
      StartupWMClass: lamsa
